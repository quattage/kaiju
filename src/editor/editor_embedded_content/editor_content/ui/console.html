<!DOCTYPE html>

<html>
    <head>
    <style>
        .bar {
            width: 100%;
            margin: 2px 4px 2px 4px;
            padding: 2px 4px 2px 4px;
            flex-wrap: nowrap;
        }
        #prompt {
            position: relative;
            background-color: var(--ed-color-panel);
            color: color-mix(in srgb var(--ed-color-text-passive) black 25%);
            border: none;
            border-radius: 0px;
            width: 90%;
            font-family: "JetBrainsMono-Regular";
        }
        #prompt:hover {
            position: relative;
            width: 200px;
            background-color: var(--ed-color-panel);
            color: var(--ed-color-text-passive);
            border: none;
            border-radius: 0px;
            width: 90%;
        }
        #prompt:focus,
        input:active {
            color: var(--ed-color-text-passive);
            border: none;
            width: 90%;
        }
        #lineIndicator {
            position: absolute;
            white-space: nowrap;
            font-family: "JetBrainsMono-Regular";
            right: 3%;
            top: 23%;
        }
    </style>
    </head>
    <body>
        <div class="tableContent" style="margin: 1px 1px 1px 1px">
            <div class="bar">

            </div>
            <div id="terminalContent" style="flex:1 1 auto; overflow:hidden"></div>
            <div class="bar">
                <input id="prompt" type="text" placeholder="enter a command..." />
                <span id="lineIndicator">line [?-?] of ?</span>
            </div>
        </div>
    </body>
</html>
